<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
</head>
<body>
<h2>用户管理</h2>

<!--1.搜索框-->
用户名:<input id="searchName">
<button onclick="searchUser()">搜索用户</button>
<button onclick="newUser()">新增用户</button>
<button onclick="logout()">退出登录</button>

<!--2.用户表格设计-->
<table border="1">                             <!-- 表格边框 -->
    <thead>
    <tr>
        <th>用户ID</th>
        <th>用户名</th>
        <th>状态</th>
        <th>创建时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody id="userList">                    <!-- 后端查到的用户信息 -->
    </tbody>
</table>

<!--3.翻页按钮-->
<button onclick="changePage(-1)">上一页</button>
<span id="pageInfo"></span>
<button onclick="changePage(1)">下一页</button>

<!--4.新增/编辑填写表单-->
<div id="formArea" style="display: none">
    <h3 id="formTitle">新增用户</h3>
    用户名：<input id="formUserName"><br>
    密码：<input id="password"><br>
    状态：<select id="status">
    <option value="0">正常</option>
    <option value="1">停用</option>
</select><br>
    <button id="saveSuo" onclick="saveUser()">保存</button>
    <button onclick="hideForm()">取消</button>
</div>
<script src="checkLogin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    let token = localStorage.getItem("token");
    let currentPage = 1;
    let totalPages = 1;
    let changeUserId = null;

    function loadList() {    // 加载用户列表（核心）
        let searchName = document.getElementById("searchName").value;
        axios.get("/user/list", {          // 调用axios
            params: {                      // 传请求参数
                pageNum: currentPage,
                userName: searchName
            },
            headers: {                     // 传请求头
                "Authorization": token
            }
        })

            .then(function (response) {
                let result = response.data;  //

                if (result.code === 401) {            // token失效，踢回登录页
                    localStorage.removeItem("token");
                    location.href = "login.html";
                    return;
                }
                let rows = result.data.rows;          // 当前页数据
                let total = result.data.total;        // 总条数
                totalPages = Math.ceil(total / 10);   // 总页数,每页十条，向上取整，eg 9条1页，11条2页

                let html = "";
                for (let i = 0; i < rows.length; i++) {
                    let user = rows[i];
                    html += "<tr>";                   // 把返回的用户拼成表格
                    html += "<td>" + user.userId + "</td>";
                    html += "<td>" + user.userName + "</td>";
                    html += "<td>" + (user.status === "0" ? "正常" : "停用") + "</td>";
                    html += "<td>" + user.createTime + "</td>";
                    html += "<td><button onclick='changeUser(" + user.userId + ")'>编辑</button>";
                    html += "<button onclick='deleteUser(" + user.userId + ")'>删除</button></td>";
                    html += "</tr>";
                }

                document.getElementById("userList").innerHTML = html;

                document.getElementById("pageInfo").innerText
                    = " 共 " + totalPages + " 页，当前第 " + currentPage + " 页";   // 分页信息文本
            })
            .catch(function (error) {
                alert("网络/后端出错！");
                console.error(error);
            });
    }

    loadList(); // 页面打开即加载列表

    function searchUser() {              // 搜索用户
        currentPage = 1;                 // 搜索后返回第一页
        loadList();
    }

    function changePage(change) {    // 翻页
        if (change < 0 && currentPage > 1 || change > 0 && currentPage < totalPages) {
            currentPage += change;
            loadList();
        }
    }

    function newUser() {         // 新增用户
        document.getElementById("formArea").style.display = "block";
        document.getElementById("formTitle").innerText = "新增用户";
        document.getElementById("formUserName").value = "";
        document.getElementById("password").value = "";
        document.getElementById("status").value = "0";
        changeUserId = null;
    }

    function hideForm() {           // 隐藏表单
        document.getElementById("formArea").style.display = "none";
    }

    function changeUser(userId) {
        axios.get("/user/" + userId, {
            headers: {"Authorization": token}
        })
            .then(function (response) {
                let result = response.data;
                if (result.code === 401) {
                    localStorage.removeItem("token");
                    location.href = "login.html";
                    return;
                }
                changeUserId = result.data.userId;
                document.getElementById("formArea").style.display = "block";   // 回填表单操作
                document.getElementById("formTitle").innerText = "编辑用户";
                document.getElementById("formUserName").value = result.data.userName;
                document.getElementById("status").value = result.data.status;
            });
    }


    function saveUser() {
        let suo = document.getElementById("saveSuo");
        suo.disabled = true;

        let body = {
            userName: document.getElementById("formUserName").value,
            status: document.getElementById("status").value
        };
        let method = "POST";
        if (changeUserId != null) {            // 非空则编辑
            body.userId = changeUserId;
            method = "PUT";
        } else {                               // 否则新增
            body.password = document.getElementById("password").value;
        }
        axios.request({
            url: "/user",
            method: method,
            data: body,
            headers: {"Authorization": token},
        }).then(function () {
            hideForm();
            loadList();
            suo.disabled = false;
        })
    }


    function deleteUser(userId) {
        if (!confirm("是否删除此用户")) return;
        axios.delete("/user/" + userId, {
            headers: {"Authorization": token}
        }).
        then(loadList)
        // fetch("/user/" + userId, {
        //     method: "DELETE",
        //     headers: {"Authorization": token}})
    }

    function logout() {
        axios.post("/logout", null, {
            headers: {"Authorization": token}
        })
            .then(function () {
            localStorage.removeItem("token");
            alert("已退出登录");
            location.href = 'login.html';
        })
    }


</script>


</body>
</html>
