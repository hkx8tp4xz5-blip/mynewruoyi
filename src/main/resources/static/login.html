<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
</head>

<body>
<h2>登录</h2>
<label>用户名：</label><input id="userName"><br>
<label>密码：</label><input id="password" type="password"><br>
<label>验证码：</label><input id="captcha"><br>
<img id="captchaImg" onclick="getCaptcha()" title="刷新验证码"><br>           <!--// 刷新验证码-->
<button onclick="login()">登录</button>
<button id="home" style="display:none" onclick="location.href='home.html'">首页</button>       <!--// 登录成功跳转首页-->
<script>
    var captchaUuid = "";

    // 获取验证码方法
    function getCaptcha() {
        fetch("/captchaImage")            // 前端访问，调用captchaImage接口进getCode创建验证码
            .then(function (resp) {
                return resp.json();
            })
            .then(function (result) {                // 接收result，把图片返回给前端
                if (result.code == 200) {
                    captchaUuid = result.data.uuid;  // 获取验证码的uuid
                    document.getElementById("captchaImg").src = "data:image/jpeg;base64," + result.data.img;  // 把图片塞进<img>标签
                } else {
                    alert(result.msg);
                }
            })
    }

    getCaptcha();

    // 登录方法
    function login() {
        var userName = document.getElementById("userName").value;    // 取出前端输入的信息放入Controller
        var password = document.getElementById("password").value;
        var captcha = document.getElementById("captcha").value;

        fetch("/login", {                  // 调进loginController
            method: "post",// 请求方法
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({userName: userName, password: password, code: captcha, uuid: captchaUuid})
        })
            .then(function (resp) {
                return resp.json();
            })
            .then(function (result) {
                if (result.code == 200) {
                    localStorage.setItem("token", result.data);
                    alert("登录成功");
                    document.getElementById("home").style.display = "block";// 显示按钮
                } else {
                    alert(result.msg);
                }

            })
    }
    
</script>
</body>
</html>
